<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Maak Sign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<style>
/* Layout: one phone-width column for the customer app; a two-column web page for the teller. Tokens = Maak UI Kit (Material 3, Wasel scheme). */
:root{
  --primary:#485e92;--on-primary:#ffffff;--primary-container:#adc3fe;--on-primary-container:#324574;
  --secondary-container:#d9dff6;--on-secondary-container:#404659;
  --surface:#faf8ff;--surface-low:#f4f3fa;--surface-c:#eeedf4;--surface-high:#e8e7ef;--surface-highest:#e2e2e9;
  --on-surface:#1a1b21;--on-surface-variant:#44464f;--outline:#757780;--outline-variant:#c5c6d0;
  --error:#b3261e;--inverse-surface:#282a2f;--inverse-on-surface:#eeedf4;--good:#2e7d4f;
  --scrim:rgba(0,0,0,.32);
  --font:"Google Sans Flex","Noto Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#b0c6ff;--on-primary:#152e60;--primary-container:#2e4578;--on-primary-container:#d9e2ff;
  --secondary-container:#404659;--on-secondary-container:#dce2f9;
  --surface:#121318;--surface-low:#1a1b21;--surface-c:#1e1f25;--surface-high:#282a2f;--surface-highest:#33343a;
  --on-surface:#e2e2e9;--on-surface-variant:#c5c6d0;--outline:#8f909a;--outline-variant:#44464f;
  --error:#f2b8b5;--inverse-surface:#e2e2e9;--inverse-on-surface:#33343a;--good:#7fd3a0;color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#b0c6ff;--on-primary:#152e60;--primary-container:#2e4578;--on-primary-container:#d9e2ff;
  --secondary-container:#404659;--on-secondary-container:#dce2f9;
  --surface:#121318;--surface-low:#1a1b21;--surface-c:#1e1f25;--surface-high:#282a2f;--surface-highest:#33343a;
  --on-surface:#e2e2e9;--on-surface-variant:#c5c6d0;--outline:#8f909a;--outline-variant:#44464f;
  --error:#f2b8b5;--inverse-surface:#e2e2e9;--inverse-on-surface:#33343a;--good:#7fd3a0;color-scheme:dark}
html,body{height:100%}
#app{height:100%}
body{background:var(--surface-low);color:var(--on-surface);font-family:var(--font);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";user-select:none;flex:none}
.ms{width:1em;overflow:hidden}
.ms.lg{font-size:48px}
.ms.fill{font-variation-settings:"FILL" 1}
/* ---------- shells ---------- */
.phone{max-width:430px;overflow-x:hidden;margin:0 auto;height:100%;background:var(--surface);display:flex;flex-direction:column;position:relative}
.web{min-height:100%;overflow-x:hidden;background:var(--surface);display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;flex:1;min-height:0}
.web .screen{min-height:100%}
#c4 .body{padding-bottom:96px}
.screen[hidden]{display:none!important}
/* ---------- top app bar ---------- */
.appbar{height:64px;display:flex;align-items:center;gap:4px;padding-inline:4px;flex:none}
.appbar h1{flex:1;margin:0;font-size:22px;line-height:28px;font-weight:400;padding-inline-start:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .lead + h1{padding-inline-start:4px}
.ib{width:48px;height:48px;border:0;background:none;border-radius:24px;display:grid;place-items:center;cursor:pointer;color:var(--on-surface-variant);position:relative}
.ib::before{content:"";position:absolute;inset:4px;border-radius:20px;background:currentColor;opacity:0;transition:opacity .15s}
.ib:hover::before{opacity:.08}.ib:active::before{opacity:.12}
.ib.tonal{color:var(--on-secondary-container)}
.ib.tonal::after{content:"";position:absolute;inset:4px;border-radius:20px;background:var(--secondary-container);z-index:-1}
.ib.tonal{z-index:0}
.ib .ms{position:relative}
/* ---------- body ---------- */
.body{flex:1;display:flex;flex-direction:column;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.body.flush{padding-inline:0;gap:4px}
.pad{padding-inline:16px}
.actions{display:flex;flex-direction:column;gap:8px;align-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));flex:none}
.actions .row{display:flex;gap:8px;width:100%}
.actions .row .btn{flex:1}
.display{font-size:36px;line-height:44px;color:var(--primary);margin:0}
.title-l{font-size:22px;line-height:28px;margin:0;font-weight:400}
.title-m{font-size:16px;line-height:24px;font-weight:500;margin:0}
.title-s{font-size:14px;line-height:20px;font-weight:500;color:var(--on-surface-variant);margin:0}
.headline-s{font-size:24px;line-height:32px;margin:0;font-weight:400}
.headline-m{font-size:28px;line-height:36px;margin:0;font-weight:400}
.body-l{font-size:16px;line-height:24px;color:var(--on-surface-variant);margin:0}
.intro-en{font-size:13px;line-height:20px;color:var(--on-surface-variant);margin:12px 0 0;text-align:left}.intro-en a{color:var(--primary);font-weight:500;display:inline-block;padding:10px 0;margin:-10px 0}
.body-m{font-size:14px;line-height:20px;color:var(--on-surface-variant);margin:0}
.label-l{font-size:14px;line-height:20px;font-weight:500;color:var(--on-surface-variant)}
.mute{color:var(--on-surface-variant)}
/* ---------- buttons ---------- */
.btn{height:40px;border-radius:20px;border:0;padding-inline:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;position:relative;overflow:hidden;white-space:nowrap}
.btn::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.btn:hover::before{opacity:.08}.btn:active::before{opacity:.12}
.btn .ms{font-size:20px}
.btn.wide{width:100%}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outline{background:none;border:1px solid var(--outline-variant);color:var(--on-surface-variant)}
.btn.text{background:none;color:var(--primary);padding-inline:12px}
.btn:disabled{background:color-mix(in srgb,var(--on-surface) 12%,transparent);color:color-mix(in srgb,var(--on-surface) 38%,transparent);cursor:default;border-color:transparent}
.btn:disabled::before{display:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
/* ---------- list ---------- */
.li{min-height:56px;display:flex;align-items:center;gap:16px;padding:8px 24px 8px 16px;padding-inline-start:16px;padding-inline-end:24px;background:none;border:0;width:100%;text-align:start;cursor:pointer;position:relative;color:var(--on-surface)}
.li::before{content:"";position:absolute;inset:0;background:var(--on-surface);opacity:0;transition:opacity .15s}
.li:hover::before{opacity:.06}
.li.two{min-height:72px}
.li .lead{color:var(--on-surface-variant)}
.li .txt{flex:1;display:flex;flex-direction:column;min-width:0}
.li .txt b{font-weight:400;font-size:16px;line-height:24px}
.li .txt small{font-size:14px;line-height:20px;color:var(--on-surface-variant)}
.li .trail{color:var(--on-surface-variant)}
.li.sel{background:var(--secondary-container);color:var(--on-secondary-container)}
.li.sel .lead,.li.sel .trail,.li.sel small{color:var(--on-secondary-container)}
.li[aria-disabled="true"]{opacity:.38;cursor:default}
.li[aria-disabled="true"]::before{display:none}
.li.static{cursor:default}.li.static::before{display:none}
/* ---------- cards ---------- */
.card{border-radius:12px;overflow:hidden;position:relative}
.card.filled{background:var(--surface-highest)}
.card.outlined{background:var(--surface);border:1px solid var(--outline-variant)}
.card .in{padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.media{display:grid;place-items:center;background:var(--surface-highest);position:relative;min-height:160px;border-radius:12px;overflow:hidden;color:var(--on-surface-variant)}
.media video,.media canvas{width:100%;height:100%;object-fit:cover;display:block}
.media .ph{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;text-align:center;font-size:14px}

/* Test mode for hearing proxy testers: ?notext hides all words on the customer screens, so the flow must work from icons and sign video alone */
.notext .phone :is(h1,p,b,label,span,a,.chip,.btn,.txt,.status){color:transparent!important;text-shadow:0 0 9px var(--on-surface-variant)!important}
.notext .phone .ms{color:var(--on-surface)!important;text-shadow:none!important}.notext .phone .btn.filled .ms{color:var(--on-primary)!important}
.notext .phone input{color:transparent;text-shadow:0 0 9px var(--on-surface)}
.media>video,.media>canvas,.media>.ph{grid-area:1/1}.media>.ph{z-index:1;align-self:center}.media{flex-shrink:0}.cam .ph{padding:12px;gap:6px}
.media .over{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.media .over .ms{font-size:56px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.cam{border:1px solid var(--outline-variant);background:var(--surface)}
.cam video{transform:scaleX(-1)}.cam canvas{position:absolute;inset:0;transform:scaleX(-1)}
.pill{position:absolute;top:10px;inset-inline-start:10px;background:var(--inverse-surface);color:var(--inverse-on-surface);font-size:12px;line-height:16px;padding:4px 10px;border-radius:8px}
.pill.rec{background:var(--error);color:#fff}
.perf{position:absolute;bottom:8px;inset-inline-end:8px;background:rgba(0,0,0,.55);color:#fff;font:12px/16px var(--font);padding:2px 8px;border-radius:6px;direction:ltr;font-variant-numeric:tabular-nums}
/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:32px;align-items:center}
.chip{height:32px;border-radius:8px;border:1px solid var(--outline-variant);padding-inline:12px 8px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--on-surface-variant);background:var(--surface)}
.chip button{border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;color:inherit;position:relative}
.chip button::before{content:"";position:absolute;inset:-11px}
.chip button .ms{font-size:18px}
/* ---------- switch ---------- */
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--surface-highest);position:relative;flex:none;cursor:pointer;padding:0}
.sw::before{content:"";position:absolute;inset:-10px -4px}
.sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--outline);top:6px;inset-inline-end:6px;transition:all .15s}
.sw[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked="true"]::after{width:24px;height:24px;top:2px;inset-inline-end:22px;background:var(--on-primary)}
.sw:disabled{opacity:.38}
.setrow{display:flex;align-items:center;gap:16px;padding:12px 24px 12px 16px;padding-inline-start:16px;padding-inline-end:24px}
.setrow .txt{flex:1;display:flex;flex-direction:column}
.setrow .txt b{font-weight:400}
.setrow .txt small{font-size:14px;color:var(--on-surface-variant)}
/* ---------- FAB + nav ---------- */
.fab{position:absolute;inset-inline-end:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));height:56px;border-radius:16px;border:0;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;gap:12px;padding-inline:16px 20px;font-size:16px;font-weight:500;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.18)}
.navbar{height:calc(80px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface-c);display:grid;grid-template-columns:repeat(3,1fr);flex:none}
.navbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;line-height:16px;font-weight:500;color:var(--on-surface-variant);cursor:pointer}
.navbar .ind{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.navbar button[aria-current="true"]{color:var(--on-surface)}
.navbar button[aria-current="true"] .ind{background:var(--secondary-container);color:var(--on-secondary-container)}
/* ---------- misc ---------- */
.visit-sum{display:flex;align-items:center;gap:16px;padding:16px 20px;color:var(--primary)}
.visit-sum .n{font-size:22px;color:var(--on-surface)}
.code{font-size:44px;line-height:52px;letter-spacing:.08em;font-variant-numeric:tabular-nums;direction:ltr;text-align:center;margin:0;display:flex;gap:16px;justify-content:center}
.code span{unicode-bidi:isolate}
.qr{background:#fff;padding:16px;border-radius:12px;display:grid;place-items:center;width:232px;height:232px;margin-inline:auto}
.qr img,.qr canvas{width:200px!important;height:200px!important}
.waiting{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--on-surface-variant)}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--primary-container);border-top-color:var(--primary);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.banner{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:12px;background:var(--surface-highest);width:100%}
.banner p{flex:1;margin:0}
.status{font-size:14px;color:var(--on-surface-variant);text-align:center;margin:0;min-height:20px}
.status.warn{color:var(--error)}
.teller-msg{display:flex;align-items:center;gap:8px}
.teller-msg p{flex:1;margin:0;font-size:16px;font-weight:500}
.snack{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));inset-inline:16px;max-width:400px;margin-inline:auto;background:var(--inverse-surface);color:var(--inverse-on-surface);padding:14px 16px;border-radius:8px;font-size:14px;z-index:30;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;padding:16px}
.dialog{background:var(--surface-high);border-radius:28px;padding:24px;width:min(360px,100%);display:flex;flex-direction:column;gap:16px;text-align:center}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px}
.field{position:relative;border:1px solid var(--outline);border-radius:4px;display:flex;align-items:center;min-height:56px;padding-inline:16px 4px}
.field:focus-within{border:2px solid var(--primary)}
.field label{position:absolute;top:-9px;inset-inline-start:12px;background:var(--surface);padding-inline:4px;font-size:12px;line-height:16px;color:var(--on-surface-variant)}
.field input{flex:1;border:0;background:none;outline:0;font-size:16px;min-width:0;height:52px}
.field input.num{direction:ltr;text-align:right;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.amount-row{display:flex;gap:8px;align-items:center;padding-inline:16px}
/* ---------- teller web ---------- */
.tbody{flex:1;display:flex;gap:24px;padding:16px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));min-height:0}
.thread{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;overflow:auto}
.reply{width:440px;flex:none;display:flex;flex-direction:column;gap:12px}
.msg{border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:6px}
.msg.c{background:var(--surface-highest)}
.msg.t{background:var(--surface);border:1px solid var(--outline-variant)}
.msg .who{font-size:14px;font-weight:500;color:var(--on-surface-variant)}
.msg .say{font-size:22px;line-height:28px}
.msg .meta{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--on-surface-variant)}
.msg .meta .ms{font-size:20px;color:var(--primary)}
.center{flex:1;display:flex;justify-content:center;padding:48px 16px}
.panel{width:min(480px,100%);display:flex;flex-direction:column;gap:16px}
.preview{height:180px}
.sheet{position:fixed;inset:auto 0 0 0;max-width:430px;margin-inline:auto;background:var(--surface-low);border-radius:28px 28px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:75%;display:flex;flex-direction:column;gap:12px;z-index:21}
.sheet .handle{width:32px;height:4px;border-radius:2px;background:var(--outline);opacity:.4;margin:8px auto 0}
.words{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:auto}
.word{min-height:56px;border-radius:12px;border:1px solid var(--outline-variant);background:var(--surface);display:flex;align-items:center;gap:8px;padding-inline:12px;cursor:pointer;font-size:16px;text-align:start}
.word .ms{color:var(--primary)}
.word:hover{background:var(--surface-c)}
@media (max-width:820px){.tbody{flex-direction:column}.reply{width:auto}}
</style>

<div id="app"></div>

  <div class="body">
    <p class="body-l">اتكلم بالإشارة، ومعاك يوصّل كلامك</p>

</section>

<section class="screen" id="c2" hidden>
  <div class="appbar"><button class="ib lead" data-back aria-label="رجوع"><span class="ms">arrow_forward</span></button><h1>قبل ما نبدأ</h1><button class="ib" data-help aria-label="شرح الشاشة بالإشارة"><span class="ms">play_circle</span></button></div>
  <div class="body flush">
    <div class="pad"><div class="media" style="height:200px"><div class="ph"><span class="ms lg">play_circle</span>الخصوصية بلغة الإشارة</div></div></div>

  </div>
  <div class="actions"><button class="btn filled wide" id="c2ok"><span class="ms">check_circle</span>موافق</button></div>
</section>

<section class="screen" id="rv" hidden>
  <div class="appbar"><span></span><h1>ساعد معاك يفهم الإشارة</h1><span></span></div>
  <div class="body flush">
    <div class="pad" style="display:flex;flex-direction:column;gap:4px;padding-block:8px"><p class="title-l">هتعمل ١٥ إشارة بنك، كل إشارة ٣ مرات. حوالي ١٠ دقايق.</p></div>
    <div class="li static"><span class="ms lead">front_hand</span><span class="txt"><b>بنسجّل نقط حركة الإيد بس</b><small>من غير فيديو ومن غير وشّك</small></span></div>
    <div class="li static"><span class="ms lead">school</span><span class="txt"><b>علشان معاك يفهم ناس أكتر</b><small>مش هتتنشر ومش هتتباع</small></span></div>
    <div class="li static"><span class="ms lead">delete</span><span class="txt"><b>تقدر تطلب مسحها في أي وقت</b><small>بالكود اللي هيظهرلك في الآخر</small></span></div>
    <div class="pad" style="display:flex;flex-direction:column;gap:8px;padding-block:8px">
      <p class="label-l">إيدك الأساسية</p>

  function onTalk(F){
    const r=classify(F);
    if(!r.length){snack('علّم معاك الإشارات الأول من «تمرين»');return}
    /* unclear (too far) or too close to call: let the customer pick instead of guessing */
    if(r[0][1]>78||(r[1]&&r[1][1]/r[0][1]<1.08)){st.alts=r.slice(0,3).map(x=>x[0]);go('c10');return}
    const k=r[0][0],now=Date.now();if(st.words[st.words.length-1]===k&&now-(st.lastAdd||0)<2500){st.lastAdd=now;return}
    st.lastAdd=now;st.words.push(k);renderChips();
  }
  $('#c8cam').onclick=()=>camButton($('#c8ph'),$('#c8pill'));
  $('#c8file').onchange=()=>fileButton($('#c8file'),$('#c8ph'));
  $('#c8clear').onclick=()=>{st.words=[];renderChips()};
  $('#c8send').onclick=()=>go('c9');
  /* ---------- C9 check ---------- */
  $('#c9yes').onclick=async()=>{
    const key=st.words.join(',');const text=st.composed&&st.composed.key===key?st.composed.text:sentenceFor(st.words);st.composed=null;st.thread.push({who:'c',text});
    if(st.room){try{await st.room.emit('say',{text,voice:!!SET.voice})}catch(e){snack('مقدرتش أبعت. اتأكد إن الموظف لسه متوصل.')}}
    else snack('مش متوصل بالموظف، ورّيله الشاشة');
    st.words=[];renderChips();hist.length=Math.max(0,hist.lastIndexOf('c8'));go('c8',false);
    if(st.room) snack('اتبعت للموظف ✔');
  };
  $('#c9no').onclick=()=>{st.words=[];renderChips();go('c8',false)};
  /* ---------- C10 not sure ---------- */
  function renderAlts(){
    $('#c10opts').innerHTML=st.alts.map((k,i)=>`<button class="li two" data-k="${k}"><span class="ms lead">play_circle</span><span class="txt"><b>${AR[k]}</b><small>إشارة ${arDigits(i+1)}</small></span></button>`).join('');
    $('#c10opts').querySelectorAll('[data-k]').forEach(b=>{
      b.onmouseenter=b.onfocus=()=>{const c=CLIP[b.dataset.k];if(c){$('#c10v').hidden=false;$('#c10ph').hidden=true;$('#c10v').src='clips/'+c+'.mp4';$('#c10v').play().catch(()=>{})}else{$('#c10v').hidden=true;$('#c10ph').hidden=false}};
      b.onclick=()=>{st.words.push(b.dataset.k);renderChips();go('c8',false)};
    });
  }
  /* ---------- visits ---------- */
  function saveVisit(){
    const v=store.get('maak_visits',[]);const d=new Date();
    v.unshift({date:d.toISOString().slice(0,10),want:wantText(),amount:st.plan.intent==='card'?null:st.plan.amount,items:st.thread.slice(-12)});
    store.set('maak_visits',v.slice(0,20));
  }
  const fmtDate=s=>{const m=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];const [y,mo,d]=s.split('-');return arDigits(+d)+' '+m[+mo-1]};
  let viewVisit=0;
  const enter={
    c1(){},
    c3(){showTeach();attach($('#c3v'),$('#c3c'),$('#c3pill'),$('#c3perf'),onTeach);if(CAM.stream){$('#c3ph').hidden=true;startCam()}},
    c4(){stopCam();const v=store.get('maak_visits',[]);$('#c4last').hidden=!v.length;if(v.length){$('#c4lastn').textContent=v[0].want;viewVisit=0}
      const n=trainedCount();$('#c4trained').textContent=n?`معاك اتعلم ${arDigits(n)} من ${arDigits(SIGNS.length)} إشارة`:'معاك لسه ما اتعلمش إشاراتك. افتح «تمرين».'},
    c5(){renderPlan()},
    c6(){$('#c6want').textContent=wantText();$('#c6amt').textContent=st.plan.intent==='card'?'':'المبلغ '+money(st.plan.amount)+' جنيه'},
    c7(){pair()},
    c8(){attach($('#c8v'),$('#c8c'),$('#c8pill'),$('#c8perf'),onTalk);renderChips();if(CAM.stream){$('#c8ph').hidden=true;startCam()}$('#c8end').hidden=!st.ended;$('#c8title').textContent=st.room?'عند الشباك · متوصل':'عند الشباك'},
    c9(){$('#c9chips').innerHTML=st.words.map(w=>`<span class="chip">${AR[w]}</span>`).join('');$('#c9text').textContent=sentenceFor(st.words);composeAgent()},
    c10(){renderAlts();$('#c10v').hidden=true;$('#c10ph').hidden=false},
    c11(){stopCam();const v=store.get('maak_visits',[]);const it=st.ended?{want:wantText(),amount:st.plan.amount,items:st.thread,date:new Date().toISOString().slice(0,10)}:v[viewVisit];
      if(!it){$('#c11list').innerHTML='<p class="body-m pad">مفيش زيارات لسه</p>';return}
      const rows=[`<div class="li static two"><span class="ms lead">check_circle</span><span class="txt"><b>${esc(it.want)}${it.amount?' · '+money(it.amount)+' جنيه':''}</b><small>${fmtDate(it.date)}</small></span></div>`];
      (it.items||[]).forEach(m=>rows.push(`<div class="li static two"><span class="ms lead">${m.who==='c'?'sign_language':'person'}</span><span class="txt"><b>${esc(m.text)}</b><small>${m.who==='c'?'إنت قلت':'الموظف قال'}</small></span></div>`));
      $('#c11list').innerHTML=rows.join('');
      if(st.ended){st.ended=false;st.thread=[];if(st.room){st.room.leave().catch(()=>{});st.room=null;st.code=null}}},
    c12(){stopCam();const v=store.get('maak_visits',[]);$('#c12list').innerHTML=v.length?v.map((x,i)=>`<button class="li two" data-visit="${i}"><span class="ms lead">account_balance</span><span class="txt"><b>بنك · ${esc(x.want)}${x.amount?' '+money(x.amount):''}</b><small>${fmtDate(x.date)}</small></span><span class="ms trail">chevron_left</span></button>`).join(''):'<p class="body-m pad" style="padding-top:16px">لسه مفيش زيارات. أول زيارة هتظهر هنا.</p>';
      $('#c12list').querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>{viewVisit=+b.dataset.visit;st.ended=false;go('c11')})},
    c13(){stopCam();$('#c13list').innerHTML=SIGNS.map((s,i)=>{const n=(TEMPL[s.k]||[]).length;return `<button class="li two" data-t="${i}"><span class="ms lead">play_circle</span><span class="txt"><b>${s.ar}</b><small>${n?'اتعلمتها':'لسه'}</small></span>${n?'<span class="ms trail">check_circle</span>':''}</button>`}).join('');
      $('#c13list').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{T.list=[SIGNS[+b.dataset.t].k];T.i=0;T.ret='c13';go('c3')})},
    async rvdone(){stopCam();const done=REC_LIST.filter(k=>(REC.reps[k]||0)>=REC_REPS).length;$('#rvmsg').textContent=`سجّلت ${arDigits(done)} من ${arDigits(REC_LIST.length)} إشارة`;$('#rvcode').textContent=REC.session;const left=await recFlush();$('#rvpending').textContent=left?`فاضل ${arDigits(left)} تسجيل لسه ما اتبعتش. اتأكد من النت ودوس «ابعت الباقي».`:'كل التسجيلات اتبعتت ✔';$('#rvretry').hidden=!left},
    c14(){stopCam();$('#c14n').textContent=`معاك اتعلم ${arDigits(trainedCount())} إشارة على الموبايل ده`},
  };
  $('#c14reset').onclick=()=>{TEMPL={};saveT();enter.c14();snack('اتمسحت الإشارات')};
  if(RECMODE){const idx=REC_LIST.findIndex(k=>(REC.reps[k]||0)<REC_REPS);if(!Object.keys(REC.reps).length)go('rv',false);else if(idx<0)go('rvdone',false);else{T.list=REC_LIST;T.i=idx;T.ret='rvdone';go('c3',false)}}
  else go(store.get('maak_onboarded',false)?'c4':'c1',false);
  bootModel().catch(()=>{});
}

/* =========================================================
   TELLER WEB APP
   ========================================================= */
function teller(){
  document.documentElement.lang='ar';document.documentElement.dir='rtl';
  $('#app').replaceChildren($('#teller').content.cloneNode(true));
  const st={room:null,visit:null,items:[],voice:false,sel:null};
  const show=id=>document.querySelectorAll('.web .screen').forEach(s=>s.hidden=s.id!==id);
  document.querySelector('[data-customer]').onclick=()=>{location.hash='';};
  const stem=w=>w.replace(/^(و|ف|ب)(?=..)/,'').replace(/^ال(?=..)/,'');
  const sstem=w=>{w=w.replace(/^و(?=...)/,'').replace(/^ف(?=ال)/,'').replace(/^(بال|لل|ال)(?=..)/,'');return w.length>4?w.replace(/(كم|نا|ها|ك|ي)$/,''):w};
  function signWordsIn(text){const tw=norm(text).split(/\s+/).map(sstem);const hits=[];for(const sg of SIGNS){const sw=norm(sg.ar).split(/\s+/).map(sstem);for(let i=0;i+sw.length<=tw.length;i++){if(sw.every((x,j)=>tw[i+j]===x)){hits.push([i,sg.k]);break}}}return hits.sort((a,b)=>a[0]-b[0]).map(h=>h[1]).filter((k,i,a)=>a.indexOf(k)===i).slice(0,5)}
  function match(text){const words=norm(text).split(/\s+/).map(stem);let best=null,bs=0,second=0;
    for(const p of TELLER){let s=0;for(const k of p.kw){const kw=norm(k).split(/\s+/).map(stem);for(let i=0;i+kw.length<=words.length;i++){if(kw.every((x,j)=>words[i+j]===x)){s=Math.max(s,kw.join('').length);break}}}if(s>bs){second=bs;bs=s;best=p}else if(s>second)second=s}
    if(!best||second===bs)return null;return best}
  // phrases
  $('#t2phr').innerHTML=TELLER.map((p,i)=>`<button class="li" data-p="${i}"><span class="ms lead">sign_language</span><span class="txt"><b>${p.t}</b></span><span class="ms trail">${p.clips.length?'play_circle':'text_snippet'}</span></button>`).join('');
  $('#t2phr').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=TELLER[+b.dataset.p];$('#t2in').value=p.t;st.sel=p;playClips($('#t2pv'),p.clips,$('#t2pph'));if(!p.clips.length)$('#t2pph').innerHTML='<span class="ms lg">text_snippet</span>الجملة دي لسه ملهاش فيديو، هتوصل للعميل كتابة'});
  $('#t2in').oninput=()=>{st.sel=null};
  // connect
  const codeIn=$('#t1code');
  const hashCode=(location.hash.match(/teller-(\d{6})/)||[])[1];if(hashCode)codeIn.value=hashCode;
  if(hashCode)queueMicrotask(()=>$('#t1go').click());
  codeIn.addEventListener('focus',()=>codeIn.select());codeIn.addEventListener('input',()=>{const d=toLatin(codeIn.value).replace(/\D/g,'');if(d.length>6)codeIn.value=d.slice(-6)});
  $('#t1go').onclick=async()=>{
    const code=toLatin(codeIn.value).replace(/\D/g,'');
    if(code.length!==6){$('#t1st').className='status warn';$('#t1st').textContent='الرقم ٦ أرقام، زي اللي على موبايل العميل';return}
    $('#t1st').className='status';$('#t1st').textContent='بيوصّل…';
    const room=await roomP;
    if(!room){$('#t1st').className='status warn';$('#t1st').textContent='التوصيل مش متاح في الصفحة دي';return}
    try{
      const r=await room.join('maak-'+code);st.room=r;await r.presence({role:'teller'});
      r.on('visit',m=>{if(m.sameTab)return;const d=m.data||{};st.visit=d;$('#t2title').textContent='العميل · بنك · '+(d.want||'');
        if(!st.items.length){addMsg('c',(d.want||'')+(d.amount?' · '+money(d.amount)+' جنيه · '+Number(d.amount).toLocaleString('en-US')+' EGP':''),'كارت الزيارة')}});
      r.on('say',m=>{if(m.sameTab)return;const d=m.data||{};addMsg('c',String(d.text||''),'بالإشارة · العميل أكّد');if(st.voice||d.voice)speak(String(d.text||''))});
      await r.emit('hello',{});
      show('t2');
    }catch(e){$('#t1st').className='status warn';$('#t1st').textContent='مقدرتش أوصل: '+(e.code||e.message||'')}
  };
  function addMsg(who,text,meta){
    $('#t2wait').hidden=true;st.items.push({who,text});
    const d=document.createElement('div');d.className='msg '+who;
    d.innerHTML=`<span class="who">${who==='c'?'العميل':'إنت'}</span><span class="say"></span><span class="meta"><span class="ms">${who==='c'?'check_circle':'sign_language'}</span><span></span></span>`;
    d.querySelector('.say').textContent=text;d.querySelector('.meta span:last-child').textContent=meta;
    $('#t2thread').appendChild(d);d.scrollIntoView({block:'end',behavior:'smooth'});
  }
  // voice toggle (read customer aloud)
  $('#t2voice').onclick=()=>{st.voice=!st.voice;$('#t2voice').setAttribute('aria-pressed',st.voice);$('#t2voice .ms').textContent=st.voice?'volume_up':'volume_off';if(st.voice)speak('الصوت اشتغل')};
  // dictation
  (async()=>{try{const d=await window.claude?.use?.('dictation');if(!d)return;const mic=$('#t2mic');mic.hidden=false;
    d.onFinal(({text})=>{$('#t2in').value=($('#t2in').value+' '+text).trim();st.sel=null});
    d.onPartial(({text})=>{$('#t2in').placeholder=text});
    d.onState(({state})=>{mic.querySelector('.ms').textContent=state==='listening'?'stop_circle':'mic'});
    mic.onclick=()=>{if(d.active()){d.stop().catch(()=>{})}else{d.start({language:'ar'}).catch(e=>{if(e&&e.code==='unavailable'){d.start().catch(()=>{})}})}};
  }catch(e){}})();
  // send → confirm
  $('#t2send').onclick=async()=>{
    const text=$('#t2in').value.trim();if(!text){$('#t2in').focus();return}
    let p=st.sel&&st.sel.t===text?st.sel:match(text);
    if(!p){const btn=$('#t2send');btn.disabled=true;const r=await agent('match',{text,phrases:TELLER.map(x=>x.t)});btn.disabled=false;if(r&&r.index>=0)p=TELLER[r.index]}
    let words=[];
    if(!p){const btn=$('#t2send');btn.disabled=true;const s=await agent('simplify',{text,vocab:SIGNS.map(x=>({k:x.k,ar:x.ar}))});btn.disabled=false;
      p={t:(s&&s.text)||text,clips:[]};words=(s&&s.words&&s.words.length)?s.words:signWordsIn(text)}
    const clips=p.clips.length?p.clips:words.map(k=>CLIP[k]).filter(Boolean);const shown=p.t;
    const dlg=$('#confirm').content.cloneNode(true).firstElementChild;document.body.appendChild(dlg);
    dlg.querySelector('[data-text]').textContent=shown;
    dlg.querySelector('[data-title]').textContent=clips.length?'هيتبعت للعميل بالإشارة':words.length?'هيتبعت للعميل بالكلمات الأساسية':'هيتبعت للعميل كتابة';
    if(words.length){const w=document.createElement('p');w.className='body-m';w.textContent='الكلمات: '+words.map(k=>AR[k]).join(' · ');dlg.querySelector('[data-text]').after(w)}
    dlg.querySelector('[data-phtext]').textContent=clips.length?'معاينة الإشارة':'مفيش فيديو إشارة للجملة دي لسه';
    playClips(dlg.querySelector('[data-v]'),clips,dlg.querySelector('[data-ph]'));
    dlg.querySelector('[data-no]').onclick=()=>{dlg.remove();$('#t2in').focus()};
    dlg.querySelector('[data-yes]').onclick=async()=>{
      dlg.remove();
      try{await st.room.emit('reply',{t:shown,clips,words})}catch(e){snack('مقدرتش أبعت، العميل ممكن يكون فصل');return}
      addMsg('t',shown,clips.length?'اتبعت للعميل بالإشارة':'اتبعت للعميل كتابة');$('#t2in').value='';st.sel=null;
    };
    dlg.querySelector('[data-yes]').focus();
  };
  $('#t2in').addEventListener('keydown',e=>{if(e.key==='Enter')$('#t2send').click()});
  // end
  $('#t2end').onclick=async()=>{
    try{await st.room?.emit('end',{items:st.items.slice(-12)})}catch(e){}
    $('#t4list').innerHTML=st.items.map(m=>`<div class="li static two" style="padding-inline:0"><span class="ms lead">${m.who==='c'?'sign_language':'person'}</span><span class="txt"><b>${esc(m.text)}</b><small>${m.who==='c'?'العميل':'إنت'}</small></span></div>`).join('')||'<p class="body-m">مفيش رسايل في الزيارة دي</p>';
    show('t4');
  };
  $('#t4new').onclick=async()=>{try{await st.room?.leave()}catch(e){}st.room=null;st.items=[];st.visit=null;$('#t2thread').querySelectorAll('.msg').forEach(m=>m.remove());$('#t2wait').hidden=false;codeIn.value='';$('#t1st').textContent='';show('t1')};
  show('t1');
}

/* ---------- route: #teller opens the teller page ---------- */
document.addEventListener('click',e=>{if(window.__maakClick&&!/^#teller/.test(location.hash))window.__maakClick(e)});
function route(){if(/^#teller/.test(location.hash))teller();else customer()}
window.addEventListener('hashchange',()=>{stopCam();route()});
route();
</script>
